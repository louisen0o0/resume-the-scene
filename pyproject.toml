[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-the-scene"
version = "0.2.0"
description = "Project memory for resuming AI-assisted work from verified task state."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []
keywords = ["ai", "agents", "project-memory", "handoff", "checkpoint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/louisen0o0/resume-the-scene"
Repository = "https://github.com/louisen0o0/resume-the-scene"
Issues = "https://github.com/louisen0o0/resume-the-scene/issues"

[project.scripts]
resume-scene = "resume_scene.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
